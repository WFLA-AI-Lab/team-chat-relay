{% extends "base.html" %}
{% block title %}{{ title }} · 需要登录 · AI 社团{% endblock %}
{% block content %}
<div class="gate">
  <div class="icon">◈</div>
  <h2>这篇教程需要登录后阅读</h2>
  <p>「{{ title }}」属于{{ level }}篇内容，面向已加入社团的成员。<br>用你的聊天站账号在本站登录后即可阅读全文。</p>
  <a class="nav-login" href="{{ url_for('login') }}?next={{ request.path }}">登录后阅读 →</a>
  <p class="hint">登录一次即可：登录状态在聊天站、擂台、教程站通用。还没有账号？联系管理员开通。</p>
</div>
{% endblock %}
